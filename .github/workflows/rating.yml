# Every 6 hours (GitHub sometimes skips scheduled runs, so a missed one costs little): rebuild the
# shared server rating from the health reports and publish it as ratings.json next to the shared
# list. Where that is (GIST_ID) and the key to update it (GIST_TOKEN) are repository secrets, so
# they do not show up here or in the public run logs.
# The old ratings.json on the "stats" branch is frozen: it is kept only for old app versions.
name: rating

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # needed only to keep this schedule switched on (step "Keep alive")

concurrency:
  group: rating
  cancel-in-progress: false

jobs:
  rating:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Build ratings.json
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          mkdir out
          python tools/rating.py out/ratings.json
      # Only this step gets the gist key; it replaces that one file and nothing else.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python -c "import json; print(json.dumps({'files': {'ratings.json': {'content': open('out/ratings.json').read()}}}))" > out/patch.json
          gh api -X PATCH "gists/$GIST_ID" --input out/patch.json --silent
      # GitHub switches scheduled workflows off after 60 days without commits. Re-enabling it
      # through the API on every run resets that timer, so the rating keeps updating by itself.
      - name: Keep alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/rating.yml/enable"
